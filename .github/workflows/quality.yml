# 文件基本信息：.github/workflows/quality.yml
# 目的：在 Windows runner 上执行项目控制、Python 测试和前端构建。
# 输入：仓库代码和锁定的 npm 依赖。
# 输出：CI 质量门禁结果；真实 HFSS 不在该工作流中伪造执行。
# 维护：门禁变化同步 AGENTS.md、验证规范和目录索引。

name: quality

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install pytest pyyaml
      - name: Check project controls
        run: python scripts/check_project_controls.py
      - name: Run non-HFSS tests
        run: python -m pytest -m "not hfss_server" -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci; npm run build
